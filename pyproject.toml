[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labtasker-webui"
version = "0.2.0"
description = "A focused web interface for Labtasker v2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "uvicorn>=0.34,<1",
  "labtasker-client>=2.1,<3",
  "packaging>=24,<27",
]

[project.urls]
Homepage = "https://github.com/luocfprime/labtasker-webui"
Repository = "https://github.com/luocfprime/labtasker-webui"
Issues = "https://github.com/luocfprime/labtasker-webui/issues"

[project.optional-dependencies]
local = ["labtasker-client>=2.1,<3"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-timeout>=2.3,<3",
  "mypy>=1.15,<3",
  "ruff>=0.11,<1",
  "pre-commit>=4.6,<5",
  "twine>=7,<8",
]

[project.scripts]
labtasker-webui = "labtasker_webui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labtasker_webui"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "src/labtasker_webui/static"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "assets", "CONTRIBUTING.md", "AGENTS.md", ".agents", "docs", "scripts", "frontend/package.json", "frontend/package-lock.json", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
timeout = 30
testpaths = ["tests"]
markers = ["integration: opt-in checks requiring a running or installed Labtasker v2 Server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["labtasker_webui"]
