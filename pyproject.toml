[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labtasker-webui"
version = "0.1.0"
description = "A focused web interface for Labtasker v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "uvicorn>=0.34,<1",
  "labtasker-client>=2.1,<3",
]

[project.optional-dependencies]
local = ["labtasker-client>=2.1,<3"]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<1"]
dev = ["mypy>=1.15,<2", "ruff>=0.11,<1"]
release = ["build>=1.2,<2", "twine>=7,<8"]

[project.scripts]
labtasker-webui = "labtasker_webui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labtasker_webui"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "src/labtasker_webui/static"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a separately running real Labtasker v2 Server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["labtasker_webui"]
